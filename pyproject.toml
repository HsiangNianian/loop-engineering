[project]
name = "loop-engineering"
version = "0.1.0"
description = "Reliable agent feedback loops with evidence, budgets, recovery, and stop conditions."
readme = "README.md"
authors = [
    { name = "HsiangNianian", email = "i@jyunko.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
loop-engineering = "loop_engineering.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
